{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — АСУТП Мониторинг</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f1117; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: .75rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    .brand-logo {
      display: block;
      max-width: 200px;
      height: auto;
      margin: 0 auto 1rem;
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f0f6fc;
      text-align: center;
      margin-bottom: .25rem;
    }
    .brand-sub { font-size: .8rem; color: #8b949e; margin-bottom: 2rem; text-align: center; }
    .form-control { background: #21262d; border-color: #30363d; color: #dee2e6; }
    .form-control:focus { background: #21262d; border-color: #58a6ff; color: #dee2e6; box-shadow: 0 0 0 0.2rem rgba(88,166,255,.2); }
    .form-label { color: #8b949e; font-size: .85rem; }
    .btn-primary { background: #238636; border-color: #238636; }
    .btn-primary:hover { background: #2ea043; border-color: #2ea043; }
  </style>
</head>
<body>
<div class="login-card">

  <img src="{% static 'img/logo.png' %}" alt="АСУТП Мониторинг" class="brand-logo">
  <div class="brand-title">АСУТП Мониторинг</div>
  <div class="brand-sub">Система мониторинга нефтяных качалок</div>

  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-danger py-2 mb-3" style="font-size:.85rem;">{{ msg }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Логин</label>
      <input type="text" name="username" class="form-control" placeholder="username" autofocus required>
    </div>
    <div class="mb-4">
      <label class="form-label">Пароль</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i> Войти
    </button>
  </form>

  <p class="text-muted text-center mt-3" style="font-size:.75rem;">
    АСУТП Мониторинг v1.0
  </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
