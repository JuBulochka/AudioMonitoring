<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Терминал — {{ device.serial_number }}</title>

<!-- xterm.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 0 12px;
    height: 40px;
    flex-shrink: 0;
    user-select: none;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-title {
    font-size: .82rem;
    font-family: monospace;
    color: #c9d1d9;
  }
  .topbar-title span { color: #8b949e; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #e3b341;
    transition: background .3s;
    flex-shrink: 0;
  }
  .status-dot.connected  { background: #3fb950; box-shadow: 0 0 6px #3fb95080; }
  .status-dot.error      { background: #f85149; }
  .status-dot.disconnected { background: #8b949e; }

  .status-text {
    font-size: .72rem;
    color: #8b949e;
    transition: color .3s;
    max-width: 420px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-text.connected  { color: #3fb950; }
  .status-text.error      { color: #f85149; }

  .topbar-right { display: flex; align-items: center; gap: 8px; }

  .btn-topbar {
    background: none;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: .72rem;
    padding: 3px 9px;
    border-radius: 5px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; gap: 4px;
  }
  .btn-topbar:hover { border-color: #58a6ff; color: #58a6ff; }
  .btn-topbar.danger:hover { border-color: #f85149; color: #f85149; }

  /* ── Terminal area ── */
  #terminal-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: 4px;
  }
  #terminal {
    width: 100%;
    height: 100%;
  }

  /* ── Overlay (connecting / error) ── */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,17,23,.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
    transition: opacity .3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-icon { font-size: 2.5rem; }
  .overlay-title { font-size: 1rem; font-weight: 600; }
  .overlay-msg   { font-size: .78rem; color: #8b949e; text-align: center; max-width: 480px; line-height: 1.5; }
  .overlay-spinner {
    width: 28px; height: 28px;
    border: 3px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .retry-btn {
    margin-top: 4px;
    padding: 6px 18px;
    background: #1f6feb;
    border: none;
    color: #fff;
    border-radius: 6px;
    font-size: .8rem;
    cursor: pointer;
  }
  .retry-btn:hover { background: #388bfd; }

  /* ── Device info panel ── */
  .device-badge {
    display: flex; align-items: center; gap: 6px;
    background: #21262d;
    border-radius: 5px;
    padding: 3px 8px;
  }
  .device-badge .serial { font-family: monospace; font-size: .78rem; color: #58a6ff; }
  .device-badge .port   { font-family: monospace; font-size: .7rem; color: #8b949e; }
</style>
</head>
<body>

<!-- ── Top bar ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="device-badge">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="#58a6ff"><circle cx="8" cy="8" r="7" stroke="#58a6ff" stroke-width="1.5" fill="none"/><path d="M5 8h6M8 5v6" stroke="#58a6ff" stroke-width="1.5"/></svg>
      <span class="serial">{{ device.serial_number }}</span>
      {% if device.tunnel_port %}
      <span class="port">:{{ device.tunnel_port }}</span>
      {% endif %}
    </div>
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Подключение…</span>
  </div>

  <div class="topbar-right">
    <span style="font-size:.68rem; color:#8b949e">{{ device.name }}</span>
    <button class="btn-topbar" onclick="clearTerminal()" title="Очистить экран">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      Очистить
    </button>
    <button class="btn-topbar" onclick="reconnect()" title="Переподключиться">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M4 9a9 9 0 0 1 15-6.7L20 5"/><path d="M20 15a9 9 0 0 1-15 6.7L4 19"/></svg>
      Переподключить
    </button>
    <button class="btn-topbar danger" onclick="window.close()" title="Закрыть">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Закрыть
    </button>
  </div>
</div>

<!-- ── Terminal ── -->
<div id="terminal-container">
  <div id="terminal"></div>

  <div id="overlay">
    <div class="overlay-spinner" id="overlaySpinner"></div>
    <div class="overlay-title" id="overlayTitle">Подключение…</div>
    <div class="overlay-msg" id="overlayMsg">Устанавливается SSH-соединение с {{ device.serial_number }}</div>
    <button class="retry-btn" id="retryBtn" style="display:none" onclick="reconnect()">
      Попробовать снова
    </button>
  </div>
</div>

<script>
const DEVICE_ID = '{{ device.id }}';
const DEVICE_SERIAL = '{{ device.serial_number }}';
const WS_URL = (location.protocol === 'https:' ? 'wss' : 'ws')
             + '://' + location.host + '/ws/ssh/' + DEVICE_ID + '/';

// ── xterm.js setup ──────────────────────────────────────────────────────────
const term = new Terminal({
  theme: {
    background: '#0d1117',
    foreground: '#c9d1d9',
    cursor:     '#58a6ff',
    cursorAccent: '#0d1117',
    black:   '#484f58',
    red:     '#ff7b72',
    green:   '#3fb950',
    yellow:  '#d29922',
    blue:    '#58a6ff',
    magenta: '#bc8cff',
    cyan:    '#39c5cf',
    white:   '#b1bac4',
    brightBlack:   '#6e7681',
    brightRed:     '#ffa198',
    brightGreen:   '#56d364',
    brightYellow:  '#e3b341',
    brightBlue:    '#79c0ff',
    brightMagenta: '#d2a8ff',
    brightCyan:    '#56d4dd',
    brightWhite:   '#f0f6fc',
  },
  fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
  fontSize: 14,
  lineHeight: 1.3,
  cursorBlink: true,
  allowProposedApi: true,
  scrollback: 5000,
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.loadAddon(new WebLinksAddon.WebLinksAddon());
term.open(document.getElementById('terminal'));
fitAddon.fit();

// Resize observer
const resizeObserver = new ResizeObserver(() => {
  fitAddon.fit();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }
});
resizeObserver.observe(document.getElementById('terminal-container'));

// ── WebSocket ────────────────────────────────────────────────────────────────
let ws = null;

function connect() {
  setStatus('connecting', 'Подключение…');
  showOverlay('spinner', 'Подключение…', `Устанавливается SSH-соединение с ${DEVICE_SERIAL}`);

  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    // Send current terminal size right away
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status') {
          handleStatus(msg.status, msg.message);
        }
      } catch(_) {}
    } else {
      // Binary: raw terminal output
      term.write(new Uint8Array(e.data));
    }
  };

  ws.onerror = () => {
    setStatus('error', 'Ошибка WebSocket');
  };

  ws.onclose = (e) => {
    if (e.code !== 1000 && e.code !== 4401) {
      setStatus('disconnected', 'Соединение закрыто');
      showOverlay('icon', 'Соединение закрыто',
        'SSH-сессия завершена. Нажмите «Переподключить» для нового сеанса.', true);
    }
  };

}

// Forward keyboard input — registered ONCE, not inside connect()
term.onData(data => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(new TextEncoder().encode(data));
  }
});

function handleStatus(status, message) {
  setStatus(status, message);
  if (status === 'connected') {
    hideOverlay();
    term.focus();
  } else if (status === 'error') {
    showOverlay('error', 'Ошибка подключения', message, true);
  } else if (status === 'disconnected') {
    showOverlay('icon', 'Сессия завершена', message, true);
  }
}

function setStatus(status, message) {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className  = 'status-dot ' + status;
  text.className = 'status-text ' + status;
  text.textContent = message;
}

// ── Overlay ──────────────────────────────────────────────────────────────────
function showOverlay(type, title, msg, showRetry = false) {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('overlaySpinner').style.display = type === 'spinner' ? 'block' : 'none';
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayMsg').textContent   = msg;
  document.getElementById('retryBtn').style.display   = showRetry ? 'inline-block' : 'none';
}

function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

// ── Actions ──────────────────────────────────────────────────────────────────
function reconnect() {
  if (ws) { try { ws.close(); } catch(_) {} }
  term.reset();
  connect();
}

function clearTerminal() {
  term.clear();
  term.focus();
}

// ── Init ─────────────────────────────────────────────────────────────────────
connect();

// Keep focus when clicking terminal area
document.getElementById('terminal-container').addEventListener('click', () => term.focus());
</script>
</body>
</html>
