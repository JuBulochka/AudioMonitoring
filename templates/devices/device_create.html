{% extends "base.html" %}
{% block title %}Добавить устройство — PumpJack Monitor{% endblock %}
{% block page_title %}Новое устройство{% endblock %}

{% block topbar_actions %}
<a href="{% url 'device-list' %}" class="btn btn-sm btn-outline-secondary">
  <i class="bi bi-arrow-left me-1"></i>К списку
</a>
{% endblock %}

{% block content %}
<form method="post" class="row g-3">
  {% csrf_token %}

  <!-- Column 1: Geographic hierarchy -->
  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header">
        <i class="bi bi-geo-alt me-1"></i>География
      </div>
      <div class="card-body">

        <!-- Region -->
        <div class="mb-3">
          <label class="form-label small text-muted">Регион</label>
          <select name="region_id" class="form-select form-select-sm mb-1" onchange="toggleNew(this, 'region_new')">
            <option value="">— Создать новый —</option>
            {% for r in regions %}<option value="{{ r.id }}">{{ r.name }} ({{ r.code }})</option>{% endfor %}
          </select>
          <div id="region_new" class="row g-2">
            <div class="col-8"><input type="text" name="region_name" class="form-control form-control-sm" placeholder="Название региона, напр. Татарстан"></div>
            <div class="col-4"><input type="text" name="region_code" class="form-control form-control-sm" placeholder="Код (TATARSTAN)"></div>
          </div>
        </div>

        <!-- Field -->
        <div class="mb-3">
          <label class="form-label small text-muted">Месторождение</label>
          <select name="field_id" class="form-select form-select-sm mb-1" onchange="toggleNew(this, 'field_new')">
            <option value="">— Создать новое —</option>
            {% for f in fields %}<option value="{{ f.id }}">{{ f.name }} ({{ f.region.name }})</option>{% endfor %}
          </select>
          <div id="field_new" class="row g-2">
            <div class="col-8"><input type="text" name="field_name" class="form-control form-control-sm" placeholder="Название, напр. Альметьевское"></div>
            <div class="col-4"><input type="text" name="field_code" class="form-control form-control-sm" placeholder="Код (авто)"></div>
          </div>
        </div>

        <!-- Site -->
        <div class="mb-3">
          <label class="form-label small text-muted">Куст скважин</label>
          <select name="site_id" class="form-select form-select-sm mb-1" onchange="toggleNew(this, 'site_new')">
            <option value="">— Создать новый —</option>
            {% for s in sites %}<option value="{{ s.id }}">{{ s.name }} ({{ s.field.name }})</option>{% endfor %}
          </select>
          <div id="site_new" class="row g-2">
            <div class="col-8"><input type="text" name="site_name" class="form-control form-control-sm" placeholder="Куст №, напр. Куст 12"></div>
            <div class="col-4"><input type="text" name="site_code" class="form-control form-control-sm" placeholder="Код (авто)"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Column 2: Device + pump jack -->
  <div class="col-lg-6">
    <div class="card h-100">
      <div class="card-header">
        <i class="bi bi-cpu me-1"></i>Устройство и скважина
      </div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label small text-muted">Номер скважины <span class="text-danger">*</span></label>
          <input type="text" name="well_number" class="form-control form-control-sm" placeholder="1234" required>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted">Название качалки</label>
          <input type="text" name="pj_name" class="form-control form-control-sm" placeholder="Авто: «Скв. 1234»">
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small text-muted">Широта</label>
            <input type="text" name="latitude" class="form-control form-control-sm" placeholder="54.9016">
          </div>
          <div class="col-6">
            <label class="form-label small text-muted">Долгота</label>
            <input type="text" name="longitude" class="form-control form-control-sm" placeholder="52.3156">
          </div>
        </div>

        <hr class="my-3" style="border-color:#30363d">

        <div class="mb-3">
          <label class="form-label small text-muted">Имя устройства (Pi)</label>
          <input type="text" name="device_name" class="form-control form-control-sm" placeholder="Авто: «Pi-1234»">
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted">Серийный номер Pi</label>
          <input type="text" name="serial_number" class="form-control form-control-sm" placeholder="Авто: «RPI-1234»">
        </div>

      </div>
    </div>
  </div>

  <!-- Submit -->
  <div class="col-12 d-flex justify-content-end gap-2">
    <a href="{% url 'device-list' %}" class="btn btn-sm btn-outline-secondary">Отмена</a>
    <button type="submit" class="btn btn-sm btn-primary">
      <i class="bi bi-plus-circle me-1"></i>Создать устройство
    </button>
  </div>
</form>

<script>
function toggleNew(select, newBlockId) {
  const block = document.getElementById(newBlockId);
  block.style.display = select.value ? "none" : "";
  block.querySelectorAll("input").forEach(i => i.disabled = !!select.value);
}
document.querySelectorAll("select[name$='_id']").forEach(s => toggleNew(s, s.getAttribute("onchange").match(/'([^']+)'/)[1]));
</script>
{% endblock %}
