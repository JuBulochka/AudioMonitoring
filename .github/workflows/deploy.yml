name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            cd ~/kursachAudio

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Checking changed files..."
            CHANGED=$(git diff HEAD~1 HEAD --name-only)

            # Build React if frontend changed OR if React is not yet in staticfiles
            REACT_DEPLOYED=$(docker compose exec -T web test -f /app/staticfiles/react/index.html 2>/dev/null && echo yes || echo no)
            if echo "$CHANGED" | grep -qE '^frontend/' || [ "$REACT_DEPLOYED" = "no" ]; then
              echo "==> Building React frontend..."
              docker run --rm \
                -v $(pwd)/frontend:/app \
                -w /app \
                node:20-alpine \
                sh -c "npm ci --prefer-offline && npm run build"
              echo "==> React frontend built successfully."
            else
              echo "==> React frontend unchanged and already deployed, skipping build."
            fi

            # Rebuild ml-service only if its files changed (TF build is slow)
            if echo "$CHANGED" | grep -qE 'ml_service/'; then
              echo "==> Rebuilding ml-service..."
              docker compose up -d --build ml-service
            fi

            # Rebuild web/celery if their deps changed
            if echo "$CHANGED" | grep -qE 'requirements\.txt|apps/.*/Dockerfile|^Dockerfile|docker-compose'; then
              echo "==> Rebuilding web + celery..."
              docker compose up -d --build web celery celery-beat
            else
              echo "==> Restarting web + celery..."
              docker compose restart web celery celery-beat
            fi

            echo "==> Waiting for entrypoint to finish (migrate + collectstatic + React copy)..."
            sleep 20

            echo "==> Reloading nginx..."
            docker compose exec -T nginx nginx -s reload

            echo "==> Verifying React deployment..."
            docker compose exec -T web ls /app/staticfiles/react/

            echo "==> Deploy complete!"
