version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pumpjack_db}
      POSTGRES_USER: ${DB_USER:-pumpjack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pumpjack_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pumpjack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
      - log_data:/app/logs
      - vnc_tokens:/vnc_tokens   # Django writes VNC routing tokens here
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    restart: unless-stopped
    command: celery -A config.celery worker --loglevel=info --concurrency=4 -Q celery
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ML_SERVICE_URL: http://ml-service:8001
    volumes:
      - .:/app
      - media_data:/app/media
      - log_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
      - log_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

  # SSH Jump Server — Raspberry Pi connects here via reverse tunnel
  # Pi SSH:  autossh -R <tunnel_port>:localhost:22  tunnel@<host> -p 2222
  # Pi VNC:  autossh -R <vnc_port>:localhost:5900   tunnel@<host> -p 2222
  sshd:
    build: ./docker/sshd
    restart: unless-stopped
    ports:
      - "2222:22"                  # Pi SSH registration port
      - "30001-30020:30001-30020"  # SSH reverse tunnel ports (one per device)
      - "31001-31020:31001-31020"  # VNC reverse tunnel ports (one per device)
    volumes:
      - ./docker/sshd/authorized_keys:/home/tunnel/.ssh/authorized_keys:ro
      - sshd_host_keys:/etc/ssh

  # ML Audio Analysis Microservice
  ml-service:
    build: ./ml_service
    restart: unless-stopped
    volumes:
      - media_data:/app/media:ro   # read-only доступ к аудиофайлам
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # YAMNet грузится ~60 сек при первом старте

  # noVNC — browser-based VNC viewer
  # Routes WebSocket connections to the right VNC tunnel port via token file.
  # Token file is written by Django when operator opens the Remote Desktop page.
  novnc:
    build: ./docker/novnc
    restart: unless-stopped
    volumes:
      - vnc_tokens:/tokens
    depends_on:
      - sshd

  # Web needs access to the vnc_tokens volume to write routing entries
  # (already mounted via docker-compose volumes below)

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  log_data:
  sshd_host_keys:
  vnc_tokens:
