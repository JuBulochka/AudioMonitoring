{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Терминал — {{ device.serial_number }}</title>

<!-- xterm.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

<link rel="stylesheet" href="{% static 'css/pages/remote-access-terminal.css' %}">
</head>
<body>

<!-- ── Top bar ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="device-badge">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="#58a6ff"><circle cx="8" cy="8" r="7" stroke="#58a6ff" stroke-width="1.5" fill="none"/><path d="M5 8h6M8 5v6" stroke="#58a6ff" stroke-width="1.5"/></svg>
      <span class="serial">{{ device.serial_number }}</span>
      {% if device.tunnel_port %}
      <span class="port">:{{ device.tunnel_port }}</span>
      {% endif %}
    </div>
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Подключение…</span>
  </div>

  <div class="topbar-right">
    <span style="font-size:.68rem; color:#8b949e">{{ device.name }}</span>
    <button class="btn-topbar" onclick="clearTerminal()" title="Очистить экран">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      Очистить
    </button>
    <button class="btn-topbar" onclick="reconnect()" title="Переподключиться">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M4 9a9 9 0 0 1 15-6.7L20 5"/><path d="M20 15a9 9 0 0 1-15 6.7L4 19"/></svg>
      Переподключить
    </button>
    <button class="btn-topbar danger" onclick="window.close()" title="Закрыть">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Закрыть
    </button>
  </div>
</div>

<!-- ── Terminal ── -->
<div id="terminal-container">
  <div id="terminal"></div>

  <div id="overlay">
    <div class="overlay-spinner" id="overlaySpinner"></div>
    <div class="overlay-title" id="overlayTitle">Подключение…</div>
    <div class="overlay-msg" id="overlayMsg">Устанавливается SSH-соединение с {{ device.serial_number }}</div>
    <button class="retry-btn" id="retryBtn" style="display:none" onclick="reconnect()">
      Попробовать снова
    </button>
  </div>
</div>

<script>
var DEVICE_ID = '{{ device.id }}';
var DEVICE_SERIAL = '{{ device.serial_number }}';
</script>
<script src="{% static 'js/pages/remote-access-terminal.js' %}"></script>
</body>
</html>
