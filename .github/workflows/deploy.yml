name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/kursachAudio

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Checking changed files..."
            CHANGED=$(git diff HEAD~1 HEAD --name-only)

            # Rebuild ml-service only if its files changed
            if echo "$CHANGED" | grep -qE '^ml_service/'; then
              echo "==> Rebuilding ml-service..."
              docker compose up -d --build ml-service
            fi

            # Rebuild web/celery if dependencies or Dockerfile changed, otherwise restart
            if echo "$CHANGED" | grep -qE 'requirements\.txt|apps/.*/Dockerfile|^Dockerfile|docker-compose'; then
              echo "==> Rebuilding web + celery..."
              docker compose up -d --build web celery celery-beat
            else
              echo "==> Restarting web + celery..."
              docker compose restart web celery celery-beat
            fi

            echo "==> Waiting for web to be ready..."
            sleep 15

            echo "==> Testing nginx config..."
            docker compose exec -T nginx nginx -t

            echo "==> Restarting nginx..."
            docker compose restart nginx

            echo "==> Deploy complete!"
